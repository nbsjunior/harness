# Example — copy to harness-agent.yml and configure secrets.
name: Harness Agent

on:
  pull_request:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent
        default: 'Review this repository for obvious bugs and missing tests.'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Harness CLI
        run: npm ci && npm run build:cli

      - name: Agent readiness
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node packages/cli/dist/index.js check getGoat --json

      - name: Run Harness agent
        env:
          HARNESS_WORKSPACE: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node packages/cli/dist/index.js agent:run \
            -a copilot \
            -p "${{ github.event.inputs.prompt || 'Review changed files for regressions.' }}"
